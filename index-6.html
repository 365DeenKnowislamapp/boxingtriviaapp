te","30 seconds","2 minutes","90 seconds"],fact:"Boxers get a one-minute rest in their corner between rounds."},{id:4,cat:"Rules",lv:"rookie",q:"What does 'KO' stand for?",opts:["Knockout","Knock over","Keep out","Kick off"],fact:"A knockout ends the fight when a downed boxer can't beat the count."},{id:5,cat:"Rules",lv:"rookie",q:"What does 'TKO' stand for?",opts:["Technical knockout","Total knockout","Timed knockout","Tie knockout"],fact:"A technical knockout is stopped by the referee, corner, or doctor."},{id:6,cat:"Rules",lv:"rookie",q:"To how many does the referee count over a downed boxer?",opts:["10","8","12","5"],fact:"A boxer must rise before the referee's count of ten."},{id:7,cat:"Rules",lv:"rookie",q:"What is the scoring system most professional bouts use?",opts:["10-point must system","5-point system","Round-win system","Golden point"],fact:"Judges award 10 points to the round winner under the 10-point must system."},{id:8,cat:"Rules",lv:"rookie",q:"How many judges typically score a professional fight?",opts:["3","1","5","2"],fact:"Three ringside judges score each round."},{id:9,cat:"Rules",lv:"rookie",q:"What is it called when a boxer is knocked to the canvas?",opts:["A knockdown","A takedown","A pin","A foul"],fact:"A knockdown is scored when a boxer touches the canvas from a punch."},{id:10,cat:"Rules",lv:"rookie",q:"What decision results when all three judges favor the same boxer?",opts:["Unanimous decision","Split decision","Majority decision","Technical decision"],fact:"A unanimous decision means all three judges scored it for one fighter."},{id:11,cat:"Rules",lv:"rookie",q:"What is a 'split decision'?",opts:["Two judges favor one boxer, one favors the other","All judges agree","A draw","A no-contest"],fact:"On a split decision, the judges are 2–1 for the winner."},{id:12,cat:"Rules",lv:"rookie",q:"What is a 'majority decision'?",opts:["Two judges favor one boxer, one scores a draw","All three agree","A one-sided draw","A disqualification"],fact:"A majority decision has two judges for the winner and one scoring a draw."},{id:13,cat:"Rules",lv:"rookie",q:"What is a 'draw' in boxing?",opts:["Neither boxer is declared the winner","A knockout","A points win","A disqualification"],fact:"A draw means the judges' scores don't produce a winner."},{id:14,cat:"Rules",lv:"rookie",q:"What is a boxer disqualified for called?",opts:["A DQ","A KO","A TKO","A no-contest"],fact:"A disqualification (DQ) ends a bout due to repeated or serious fouls."},{id:15,cat:"Rules",lv:"rookie",q:"What is the padded enclosure boxers fight in called?",opts:["The ring","The cage","The pit","The court"],fact:"Boxers compete inside a roped, square ring."},{id:16,cat:"Rules",lv:"rookie",q:"What shape is a boxing ring?",opts:["Square","Round","Octagonal","Triangular"],fact:"Despite the name 'ring,' it is square."},{id:17,cat:"Rules",lv:"rookie",q:"What bounds the boxing ring on its sides?",opts:["Ropes","Walls","A fence","Netting"],fact:"Four ropes on posts enclose the ring."},{id:18,cat:"Rules",lv:"rookie",q:"Who enforces the rules inside the ring during a fight?",opts:["The referee","A judge","The timekeeper","The promoter"],fact:"The referee controls the action and can stop the bout."},{id:19,cat:"Rules",lv:"rookie",q:"What is a 'clinch'?",opts:["When boxers hold each other to stop the action","A type of punch","A knockdown","A foul punch"],fact:"A clinch is a defensive hold the referee breaks up."},{id:20,cat:"Rules",lv:"rookie",q:"What is a 'low blow'?",opts:["A punch below the belt","A punch to the head","A body shot to the ribs","A jab"],fact:"A punch below the beltline is an illegal low blow."},{id:21,cat:"Rules",lv:"rookie",q:"What is hitting behind the head called?",opts:["A rabbit punch","A hook","An uppercut","A cross"],fact:"A rabbit punch strikes the back of the head and is illegal."},{id:22,cat:"Rules",lv:"rookie",q:"What signals the start and end of each round?",opts:["A bell","A whistle","A buzzer horn only","A flag"],fact:"A bell marks the beginning and end of every round."},{id:23,cat:"Rules",lv:"rookie",q:"What is the 'standing eight count'?",opts:["A referee's count to judge a hurt but standing boxer","A rest period","A scoring method","A warning for fouls"],fact:"A standing eight count lets the referee assess a dazed boxer."},{id:24,cat:"Rules",lv:"rookie",q:"What happens if a boxer's corner throws in the towel?",opts:["The fight is stopped (TKO)","The round restarts","The boxer is warned","Nothing"],fact:"Throwing in the towel signals the corner's surrender, ending the bout."},{id:25,cat:"Rules",lv:"rookie",q:"What is a 'no-contest'?",opts:["A bout ruled invalid, with no winner","A draw","A knockout","A disqualification"],fact:"A no-contest voids the result, often due to an accidental foul or issue."},{id:26,cat:"Rules",lv:"rookie",q:"How many knockdowns in a round traditionally could trigger an automatic stoppage rule?",opts:["Three (the three-knockdown rule, when in effect)","Five","Two","Ten"],fact:"The three-knockdown rule, when applied, stops a bout after three knockdowns in a round."},{id:27,cat:"Rules",lv:"rookie",q:"What is it called when a fight is stopped due to a cut?",opts:["A stoppage / TKO","A draw","A no-contest always","A DQ"],fact:"Severe cuts can force the doctor or referee to stop the fight."},{id:28,cat:"Rules",lv:"rookie",q:"What is 'saved by the bell'?",opts:["When the round ends before a count is completed","A scoring bonus","A referee's warning","A type of punch"],fact:"The phrase refers to a round ending before a downed boxer is counted out."},{id:29,cat:"Rules",lv:"rookie",q:"What is the minimum a boxer usually must do after a knockdown to continue?",opts:["Rise and show they can defend themselves","Sit down","Leave the ring","Call a timeout"],fact:"A boxer must get up and satisfy the referee they can continue."},{id:30,cat:"Rules",lv:"rookie",q:"What is the piece of clothing that marks the legal lower boundary for punches?",opts:["The beltline / trunks line","The shoes","The gloves","The headgear"],fact:"Punches must land above the belt."},{id:31,cat:"Rules",lv:"rookie",q:"What is a bout with no title on the line called?",opts:["A non-title fight","A championship","An exhibition only","A sparring match"],fact:"A non-title fight has no belt at stake."},{id:32,cat:"Rules",lv:"rookie",q:"What is a 'unification' bout?",opts:["A fight to combine titles from different sanctioning bodies","A rematch","A tune-up","An exhibition"],fact:"A unification bout puts multiple belts on the line at once."},{id:33,cat:"Rules",lv:"rookie",q:"What is a mandatory challenger?",opts:["A contender a champion is required to fight","The promoter's pick","A retired boxer","A sparring partner"],fact:"Sanctioning bodies order champions to face mandatory challengers."},{id:34,cat:"Rules",lv:"rookie",q:"What is the 'count' administered to a downed boxer measured in?",opts:["Seconds","Rounds","Points","Punches"],fact:"The referee counts seconds, up to ten, over a fallen boxer."},{id:35,cat:"Rules",lv:"rookie",q:"What is a 'technical decision'?",opts:["A points result after an early stoppage for an accidental foul","A knockout","A draw","A disqualification"],fact:"If a bout ends early on an accidental foul past a certain round, judges' cards decide it."},{id:36,cat:"Styles",lv:"rookie",q:"What is a straight punch with the lead hand called?",opts:["A jab","A hook","An uppercut","A cross"],fact:"The jab is the quick, straight lead-hand punch."},{id:37,cat:"Styles",lv:"rookie",q:"What is a straight punch with the rear hand called?",opts:["A cross","A jab","A hook","A bolo"],fact:"The cross (straight right for orthodox boxers) is thrown with the rear hand."},{id:38,cat:"Styles",lv:"rookie",q:"What is a punch that swings in a horizontal arc called?",opts:["A hook","A jab","A cross","A straight"],fact:"A hook travels in a sideways arc, often to the head or body."},{id:39,cat:"Styles",lv:"rookie",q:"What is an upward punch to the chin called?",opts:["An uppercut","A jab","A hook","A cross"],fact:"The uppercut rises vertically, typically to the chin."},{id:40,cat:"Styles",lv:"rookie",q:"What is a combination in boxing?",opts:["A series of punches thrown in sequence","A single big punch","A defensive stance","A clinch"],fact:"A combination strings punches together, like a jab-cross."},{id:41,cat:"Styles",lv:"rookie",q:"What is a body shot?",opts:["A punch to the torso","A punch to the head","A low blow","A foul"],fact:"Body shots target the ribs and midsection to wear an opponent down."},{id:42,cat:"Styles",lv:"rookie",q:"What is the classic first combination taught, 'the one-two'?",opts:["Jab then cross","Hook then uppercut","Two jabs","Two hooks"],fact:"The one-two is a jab followed by a straight cross."},{id:43,cat:"Styles",lv:"rookie",q:"What is a boxer's defensive move that dips under a punch called?",opts:["A slip or duck","A jab","A clinch","A feint"],fact:"Slipping and ducking move the head off the line of a punch."},{id:44,cat:"Styles",lv:"rookie",q:"What is a 'feint'?",opts:["A fake movement to mislead the opponent","A knockout punch","A clinch","A low blow"],fact:"A feint fakes an action to draw a reaction."},{id:45,cat:"Styles",lv:"rookie",q:"What is 'footwork' in boxing?",opts:["Movement and positioning of the feet","A type of punch","A scoring method","A foul"],fact:"Footwork controls range, angles, and balance."},{id:46,cat:"Styles",lv:"rookie",q:"What is a boxer's 'guard'?",opts:["The defensive position of the hands and arms","A cornerman","A referee","A weight class"],fact:"The guard is how a boxer holds the hands to protect the head and body."},{id:47,cat:"Styles",lv:"rookie",q:"What is 'the pocket' in boxing?",opts:["Close range where exchanges happen","The corner","Outside the ropes","The locker room"],fact:"Fighting 'in the pocket' means trading at close range."},{id:48,cat:"Divisions",lv:"rookie",q:"Which is boxing's heaviest traditional weight class?",opts:["Heavyweight","Cruiserweight","Middleweight","Welterweight"],fact:"Heavyweight has no upper limit and is the marquee division."},{id:49,cat:"Divisions",lv:"rookie",q:"Which division sits just below heavyweight?",opts:["Cruiserweight","Light heavyweight","Middleweight","Welterweight"],fact:"Cruiserweight is the class directly beneath heavyweight."},{id:50,cat:"Divisions",lv:"rookie",q:"Which division is famously the 147-pound limit, a 'glamour' class?",opts:["Welterweight","Heavyweight","Featherweight","Bantamweight"],fact:"Welterweight (147 lb) has produced many legendary champions."},{id:51,cat:"Divisions",lv:"rookie",q:"Which class is the 160-pound limit?",opts:["Middleweight","Welterweight","Lightweight","Cruiserweight"],fact:"Middleweight is set at 160 pounds."},{id:52,cat:"Divisions",lv:"rookie",q:"Which class is the 135-pound limit?",opts:["Lightweight","Welterweight","Featherweight","Flyweight"],fact:"Lightweight is the 135-pound division."},{id:53,cat:"Divisions",lv:"rookie",q:"What separates one weight class from another?",opts:["A maximum weight limit","Height","Reach","Age"],fact:"Each division has an upper weight limit fighters must make."},{id:54,cat:"Divisions",lv:"rookie",q:"What is the pre-fight ritual where boxers confirm they made the limit?",opts:["The weigh-in","The face-off","The walkout","The count"],fact:"At the weigh-in, boxers step on the scale to confirm the weight."},{id:55,cat:"Divisions",lv:"rookie",q:"What is a boxer who competes above their usual class said to be doing?",opts:["Moving up in weight","Cutting weight","Making weight","Weighing in"],fact:"Moving up means fighting in a heavier division."},{id:56,cat:"Divisions",lv:"rookie",q:"What is 'making weight'?",opts:["Reaching the division's limit at the weigh-in","Gaining muscle","Eating before a fight","Losing a bout"],fact:"Making weight means hitting the required limit on the scale."},{id:57,cat:"Divisions",lv:"rookie",q:"Which is lighter, flyweight or heavyweight?",opts:["Flyweight","Heavyweight","They are equal","Neither is a weight class"],fact:"Flyweight is one of the lightest divisions; heavyweight is the heaviest."},{id:58,cat:"Divisions",lv:"rookie",q:"Which division is the 126-pound limit?",opts:["Featherweight","Lightweight","Bantamweight","Welterweight"],fact:"Featherweight is set at 126 pounds."},{id:59,cat:"Divisions",lv:"rookie",q:"Which division is the 118-pound limit?",opts:["Bantamweight","Featherweight","Flyweight","Lightweight"],fact:"Bantamweight is the 118-pound class."},{id:60,cat:"Divisions",lv:"rookie",q:"Which division is the 175-pound limit?",opts:["Light heavyweight","Cruiserweight","Middleweight","Super middleweight"],fact:"Light heavyweight is set at 175 pounds."},{id:61,cat:"Divisions",lv:"rookie",q:"Which division is the 168-pound limit?",opts:["Super middleweight","Middleweight","Light heavyweight","Welterweight"],fact:"Super middleweight is the 168-pound class."},{id:62,cat:"Divisions",lv:"rookie",q:"Which division is the 154-pound limit, between welter and middle?",opts:["Super welterweight (junior middleweight)","Lightweight","Cruiserweight","Featherweight"],fact:"Super welterweight, or junior middleweight, is 154 pounds."},{id:63,cat:"Divisions",lv:"rookie",q:"Which division is the 130-pound limit?",opts:["Super featherweight (junior lightweight)","Featherweight","Lightweight","Bantamweight"],fact:"Super featherweight, or junior lightweight, is 130 pounds."},{id:64,cat:"Divisions",lv:"rookie",q:"Which division is the 140-pound limit?",opts:["Super lightweight (junior welterweight)","Lightweight","Welterweight","Featherweight"],fact:"Super lightweight, or junior welterweight, is 140 pounds."},{id:65,cat:"Divisions",lv:"rookie",q:"Roughly how many weight divisions does modern pro boxing recognize?",opts:["Around 17","About 5","Exactly 10","Over 30"],fact:"Modern boxing recognizes about 17 weight divisions."},{id:66,cat:"Titles",lv:"rookie",q:"What does 'WBC' stand for?",opts:["World Boxing Council","World Boxing Committee","World Belt Championship","World Bout Coalition"],fact:"The WBC is one of boxing's four major sanctioning bodies."},{id:67,cat:"Titles",lv:"rookie",q:"What does 'WBA' stand for?",opts:["World Boxing Association","World Bout Alliance","World Belt Authority","World Boxing Academy"],fact:"The WBA is among the four major sanctioning bodies."},{id:68,cat:"Titles",lv:"rookie",q:"What does 'IBF' stand for?",opts:["International Boxing Federation","International Bout Foundation","Intercontinental Boxing Forum","International Belt Federation"],fact:"The IBF is one of the four major sanctioning bodies."},{id:69,cat:"Titles",lv:"rookie",q:"What does 'WBO' stand for?",opts:["World Boxing Organization","World Bout Order","World Belt Organization","World Boxing Office"],fact:"The WBO is the fourth of boxing's major sanctioning bodies."},{id:70,cat:"Titles",lv:"rookie",q:"How many 'major' world sanctioning bodies are there in boxing?",opts:["Four (WBC, WBA, IBF, WBO)","Two","Six","One"],fact:"The four majors are the WBC, WBA, IBF, and WBO."},{id:71,cat:"Titles",lv:"rookie",q:"What is a boxer who holds all four major belts called?",opts:["Undisputed champion","Lineal champion","Interim champion","Unified champion"],fact:"Holding all four major titles makes a fighter undisputed."},{id:72,cat:"Titles",lv:"rookie",q:"What is a champion who beat 'the man who beat the man' called?",opts:["The lineal champion","The interim champion","The mandatory","The undisputed champion"],fact:"The lineal title passes directly from champion to conqueror."},{id:73,cat:"Titles",lv:"rookie",q:"What is the physical award a champion receives?",opts:["A belt","A trophy cup","A medal","A ring"],fact:"World champions are awarded championship belts."},{id:74,cat:"Titles",lv:"rookie",q:"What is an 'interim' title?",opts:["A temporary belt when the champion is inactive or injured","The main title","A retired belt","An amateur title"],fact:"An interim champion holds a placeholder belt pending the full champion's return."},{id:75,cat:"Titles",lv:"rookie",q:"What is a 'title defense'?",opts:["A champion fighting to keep their belt","Winning a belt","Losing a belt","An amateur bout"],fact:"A title defense is a champion putting the belt on the line."},{id:76,cat:"Rules",lv:"rookie",q:"What do boxers wear on their hands?",opts:["Gloves","Bare knuckles","Wraps only","Mitts"],fact:"Padded gloves protect the hands and reduce cuts."},{id:77,cat:"Rules",lv:"rookie",q:"What is wrapped around a boxer's hands under the gloves?",opts:["Hand wraps","Tape only","Nothing","Bandanas"],fact:"Hand wraps support the wrists and knuckles beneath the gloves."},{id:78,cat:"Rules",lv:"rookie",q:"What protects a boxer's teeth?",opts:["A mouthguard","A chin strap","A face mask","A helmet"],fact:"A mouthguard cushions the teeth and jaw."},{id:79,cat:"Rules",lv:"rookie",q:"What protective gear is worn in most amateur bouts on the head?",opts:["Headgear","A helmet with a cage","A hood","Nothing"],fact:"Amateur boxing has traditionally used protective headgear."},{id:80,cat:"Rules",lv:"rookie",q:"What do boxers wear below the waist for protection?",opts:["A groin protector","Shin guards","Knee pads","A back brace"],fact:"A protective cup guards against low blows."},{id:81,cat:"Rules",lv:"rookie",q:"What do boxers typically wear on the lower body?",opts:["Trunks","Long pants","Shorts and a shirt","A singlet"],fact:"Boxers compete in trunks (shorts)."},{id:82,cat:"Rules",lv:"rookie",q:"What footwear do boxers wear?",opts:["Boxing boots","Cleats","Sandals","Bare feet"],fact:"Light, high-top boxing boots aid footwork and ankle support."},{id:83,cat:"Rules",lv:"rookie",q:"What is the corner stool used for?",opts:["Resting between rounds","Standing on to reach","Blocking punches","Scoring"],fact:"Boxers sit on a corner stool during the one-minute rest."},{id:84,cat:"Trainers",lv:"rookie",q:"Who instructs and prepares a boxer for fights?",opts:["The trainer","The promoter","The judge","The timekeeper"],fact:"The trainer develops skills and strategy."},{id:85,cat:"Trainers",lv:"rookie",q:"Who works on cuts and swelling between rounds?",opts:["The cutman","The referee","The judge","The announcer"],fact:"The cutman treats cuts and swelling in the corner."},{id:86,cat:"Trainers",lv:"rookie",q:"What is the group in a boxer's corner called?",opts:["The corner team","The bench","The bullpen","The pit crew"],fact:"The corner team includes the trainer and cutman."},{id:87,cat:"Promoters",lv:"rookie",q:"Who organizes and finances boxing events?",opts:["The promoter","The referee","The judge","The cutman"],fact:"Promoters stage events and match fighters."},{id:88,cat:"Promoters",lv:"rookie",q:"What is the pre-fight event where boxers pose face-to-face called?",opts:["The face-off / staredown","The weigh-in count","The walkout","The huddle"],fact:"At the staredown, boxers pose nose-to-nose for cameras."},{id:89,cat:"Promoters",lv:"rookie",q:"What is a fighter's entrance to the ring called?",opts:["The walkout","The weigh-in","The count","The corner"],fact:"The walkout is the boxer's entrance, often with music."},{id:90,cat:"Boxers",lv:"rookie",q:"Which heavyweight called himself 'The Greatest'?",opts:["Muhammad Ali","Joe Frazier","George Foreman","Sonny Liston"],fact:"Muhammad Ali proclaimed himself 'The Greatest.'"},{id:91,cat:"Boxers",lv:"rookie",q:"By what name was Muhammad Ali known before changing it?",opts:["Cassius Clay","Sonny Banks","Joe Louis","Archie Moore"],fact:"Ali was born Cassius Clay and changed his name in 1964."},{id:92,cat:"Boxers",lv:"rookie",q:"Which boxer was nicknamed 'Iron Mike'?",opts:["Mike Tyson","Mike Weaver","Michael Spinks","Mikkel Kessler"],fact:"Mike Tyson was 'Iron Mike,' a fearsome young heavyweight champion."},{id:93,cat:"Boxers",lv:"rookie",q:"Which heavyweight great was 'Smokin' Joe'?",opts:["Joe Frazier","Joe Louis","Joe Calzaghe","Joe Frazier Jr."],fact:"Joe Frazier, 'Smokin' Joe,' was famed for his left hook."},{id:94,cat:"Boxers",lv:"rookie",q:"Which two-time heavyweight champ later became a grill entrepreneur?",opts:["George Foreman","Larry Holmes","Ken Norton","Leon Spinks"],fact:"George Foreman regained the title and later sold a famous grill."},{id:95,cat:"Boxers",lv:"rookie",q:"Which boxer is nicknamed 'Sugar Ray' and considered pound-for-pound the greatest by many?",opts:["Sugar Ray Robinson","Sugar Ray Leonard","Sugar Shane Mosley","Ray Mancini"],fact:"Sugar Ray Robinson is frequently called the best pound-for-pound ever."},{id:96,cat:"Boxers",lv:"rookie",q:"Which 1980s star was also called 'Sugar Ray'?",opts:["Sugar Ray Leonard","Sugar Ray Robinson","Ray Mercer","Ray Boom Boom Mancini"],fact:"Sugar Ray Leonard was a marquee champion of the 1980s."},{id:97,cat:"Boxers",lv:"rookie",q:"Which undefeated retired champion finished 50-0?",opts:["Floyd Mayweather","Manny Pacquiao","Oscar De La Hoya","Bernard Hopkins"],fact:"Floyd Mayweather retired with a 50-0 record."},{id:98,cat:"Boxers",lv:"rookie",q:"Which Filipino icon won world titles in multiple weight divisions?",opts:["Manny Pacquiao","Nonito Donaire","Donnie Nietes","Gerry Peñalosa"],fact:"Manny Pacquiao won titles across an unusually wide range of divisions."},{id:99,cat:"Boxers",lv:"rookie",q:"Which heavyweight retired undefeated at 49-0 in the 1950s?",opts:["Rocky Marciano","Joe Louis","Jack Dempsey","Gene Tunney"],fact:"Rocky Marciano is the only heavyweight champ to retire undefeated at 49-0."},{id:100,cat:"Boxers",lv:"rookie",q:"Which champion was 'The Brown Bomber'?",opts:["Joe Louis","Joe Frazier","Floyd Patterson","Ezzard Charles"],fact:"Joe Louis, the Brown Bomber, held the heavyweight title for years."},{id:101,cat:"Boxers",lv:"rookie",q:"Which boxer was nicknamed 'Golden Boy'?",opts:["Oscar De La Hoya","Fernando Vargas","Julio César Chávez","Marco Antonio Barrera"],fact:"Oscar De La Hoya, the Golden Boy, won Olympic gold and world titles."},{id:102,cat:"Boxers",lv:"rookie",q:"Which middleweight great was 'Marvelous Marvin'?",opts:["Marvin Hagler","Marvis Frazier","Michael Nunn","Mustafa Hamsho"],fact:"Marvelous Marvin Hagler ruled the middleweight division in the 1980s."},{id:103,cat:"Boxers",lv:"rookie",q:"Which Panamanian legend was 'Hands of Stone'?",opts:["Roberto Durán","Alexis Argüello","Wilfredo Gómez","Eusebio Pedroza"],fact:"Roberto Durán, 'Manos de Piedra,' was a ferocious lightweight great."},{id:104,cat:"Boxers",lv:"rookie",q:"Which puncher was 'The Hitman' of Detroit's Kronk gym?",opts:["Thomas Hearns","Tommy Morrison","Michael Moorer","Milton McCrory"],fact:"Thomas Hearns, the Hitman, was a devastating knockout artist."},{id:105,cat:"Boxers",lv:"rookie",q:"Which Mexican icon was 'JC Superstar' with a long unbeaten start?",opts:["Julio César Chávez","Erik Morales","Juan Manuel Márquez","Ricardo López"],fact:"Julio César Chávez was Mexico's beloved multi-division champion."},{id:106,cat:"Boxers",lv:"rookie",q:"Which British-born heavyweight unified titles in the late 1990s?",opts:["Lennox Lewis","Frank Bruno","Herbie Hide","Henry Akinwande"],fact:"Lennox Lewis became an undisputed heavyweight champion."},{id:107,cat:"Boxers",lv:"rookie",q:"Which heavyweight was 'The Real Deal' and beat Tyson twice?",opts:["Evander Holyfield","Riddick Bowe","Michael Moorer","Ray Mercer"],fact:"Evander Holyfield defeated Mike Tyson in both of their meetings."},{id:108,cat:"Boxers",lv:"rookie",q:"Which Ukrainian brothers dominated the heavyweight division in the 2000s?",opts:["The Klitschkos","The Charrs","The Chagaevs","The Byrds"],fact:"Wladimir and Vitali Klitschko held heavyweight titles for years."},{id:109,cat:"Boxers",lv:"rookie",q:"Which boxer was nicknamed 'The Executioner' at middleweight and beyond?",opts:["Bernard Hopkins","Winky Wright","Jermain Taylor","Kelly Pavlik"],fact:"Bernard Hopkins, the Executioner, had a remarkably long championship career."},{id:110,cat:"History",lv:"rookie",q:"What is boxing sometimes called, referencing its skill?",opts:["The sweet science","The beautiful game","The squared circle sport","The gentle art"],fact:"Boxing is famously nicknamed 'the sweet science.'"},{id:111,cat:"History",lv:"rookie",q:"What is another nickname for the boxing ring?",opts:["The squared circle","The gridiron","The pitch","The diamond"],fact:"The ring is called the 'squared circle.'"},{id:112,cat:"History",lv:"rookie",q:"What is an amateur boxing bout usually scheduled for (rounds)?",opts:["3 rounds","12 rounds","15 rounds","1 round"],fact:"Amateur bouts are typically three rounds."},{id:113,cat:"History",lv:"rookie",q:"Which international event features amateur boxing every four years?",opts:["The Olympic Games","The Super Bowl","The World Cup","The Ryder Cup"],fact:"Boxing has long been an Olympic sport."},{id:114,cat:"History",lv:"rookie",q:"What is a professional boxer's win-loss-draw summary called?",opts:["Their record","Their rank","Their purse","Their reach"],fact:"A record lists wins, losses, and draws (with KOs noted)."},{id:115,cat:"History",lv:"rookie",q:"What is the money a boxer earns for a fight called?",opts:["The purse","The pot","The gate","The cut"],fact:"The purse is a boxer's payment for the bout."},{id:116,cat:"History",lv:"rookie",q:"What is the ticket revenue from fans at the arena called?",opts:["The gate","The purse","The cut","The bond"],fact:"The live 'gate' is the arena ticket revenue."},{id:117,cat:"History",lv:"rookie",q:"What broadcast model do big fights often use for at-home viewers?",opts:["Pay-per-view","Free radio only","Public access only","Silent film"],fact:"Major fights are frequently sold as pay-per-view events."},{id:118,cat:"Stats",lv:"rookie",q:"What does a boxer's 'reach' measure?",opts:["Arm span, fingertip to fingertip","Height","Weight","Fist size"],fact:"Reach is the arm span, affecting range."},{id:119,cat:"Stats",lv:"rookie",q:"What is an 'orthodox' stance?",opts:["Left foot forward, leading with the left hand","Right foot forward","A crouch","A square-on stance"],fact:"Orthodox boxers lead with the left, powering with the right."},{id:120,cat:"Stats",lv:"rookie",q:"What is a 'southpaw'?",opts:["A left-handed stance leading with the right hand","A right-handed stance","A defensive move","A type of glove"],fact:"Southpaws lead with the right and power with the left."},{id:121,cat:"Stats",lv:"rookie",q:"What is a boxer with many knockouts called?",opts:["A puncher / knockout artist","A jabber","A journeyman","A counterpuncher"],fact:"Big hitters are called punchers or knockout artists."},{id:122,cat:"Stats",lv:"rookie",q:"What is a defensive boxer who waits to punch back called?",opts:["A counterpuncher","A slugger","A brawler","A pressure fighter"],fact:"A counterpuncher capitalizes on the opponent's mistakes."},{id:123,cat:"Stats",lv:"rookie",q:"What is a fighter who constantly advances called?",opts:["A pressure fighter","A runner","A spoiler","A stylist"],fact:"A pressure fighter walks opponents down aggressively."},{id:124,cat:"Stats",lv:"rookie",q:"What is a technically skilled, elusive boxer often called?",opts:["A boxer / stylist","A brawler","A puncher","A slugger"],fact:"A pure 'boxer' or stylist relies on skill and movement."},{id:125,cat:"Stats",lv:"rookie",q:"What does 'pound-for-pound' rank?",opts:["The best fighters regardless of weight","Only heavyweights","Ticket sales","Punch power in pounds"],fact:"Pound-for-pound compares fighters across divisions on skill."},{id:126,cat:"Rules",lv:"rookie",q:"What is the beltline for legal punches based on?",opts:["The imaginary line at the top of the trunks","The knees","The shoulders","The neck"],fact:"Legal punches must land above the waistline of the trunks."},{id:127,cat:"Rules",lv:"rookie",q:"What is holding and hitting?",opts:["A foul combining a clinch with a punch","A legal combination","A defensive skill","A scoring bonus"],fact:"Holding while punching is a foul."},{id:128,cat:"Rules",lv:"rookie",q:"What is a headbutt ruled as?",opts:["A foul","A legal strike","A knockdown","A scoring blow"],fact:"Intentional or careless headbutts are fouls."},{id:129,cat:"Rules",lv:"rookie",q:"What is 'hitting on the break'?",opts:["Punching as the referee separates a clinch — a foul","A legal counter","A scoring blow","A defensive move"],fact:"Punching during a commanded break is illegal."},{id:130,cat:"Rules",lv:"rookie",q:"What is the referee's instruction to stop fighting momentarily?",opts:["Break","Time in","Seconds out","Box"],fact:"'Break' orders boxers to separate from a clinch."},{id:131,cat:"Rules",lv:"rookie",q:"What does the referee say to start the action?",opts:["Box","Fight now","Go","Begin round"],fact:"Referees typically command 'Box' to begin."},{id:132,cat:"Rules",lv:"rookie",q:"What is the command telling corners to leave before a round?",opts:["Seconds out","Time in","Break","Clear ring"],fact:"'Seconds out' clears the corners before the bell."},{id:133,cat:"Rules",lv:"rookie",q:"What is a point deduction for?",opts:["A penalty for fouls, subtracted from a round score","A knockdown bonus","A round win","A title defense"],fact:"Referees can order judges to deduct points for fouls."},{id:134,cat:"Rules",lv:"rookie",q:"What happens on an accidental low blow that hurts a boxer?",opts:["The referee may give recovery time","The fight ends instantly","The other boxer is DQ'd automatically","Nothing changes"],fact:"Referees can allow a boxer time to recover from an accidental low blow."},{id:135,cat:"Rules",lv:"rookie",q:"What is a 'unification' belt collection short of all four called?",opts:["Unified champion","Undisputed champion","Lineal champion","Interim champion"],fact:"Holding two or three of the four majors makes a fighter unified, not undisputed."},{id:136,cat:"Divisions",lv:"rookie",q:"Which is heavier, welterweight or lightweight?",opts:["Welterweight","Lightweight","They are equal","Neither is a division"],fact:"Welterweight (147) is heavier than lightweight (135)."},{id:137,cat:"Divisions",lv:"rookie",q:"Which is heavier, middleweight or welterweight?",opts:["Middleweight","Welterweight","They are equal","Neither"],fact:"Middleweight (160) is heavier than welterweight (147)."},{id:138,cat:"Divisions",lv:"rookie",q:"Which of these is a real division?",opts:["Bantamweight","Turbo-weight","Ultraweight","Prime-weight"],fact:"Bantamweight is a genuine boxing division."},{id:139,cat:"Divisions",lv:"rookie",q:"What is a catchweight?",opts:["An agreed weight outside standard division limits","The heaviest class","A tag-team weight","An amateur-only limit"],fact:"A catchweight is a negotiated limit between two standard classes."},{id:140,cat:"Boxers",lv:"rookie",q:"Which nickname belongs to Mike Tyson besides 'Iron Mike'?",opts:["The Baddest Man on the Planet","The Real Deal","The Executioner","Prince Naseem"],fact:"Tyson was billed as 'the Baddest Man on the Planet.'"},{id:141,cat:"Boxers",lv:"rookie",q:"Which flamboyant featherweight was 'Prince' Naseem?",opts:["Naseem Hamed","Barry McGuigan","Ricky Hatton","Amir Khan"],fact:"Prince Naseem Hamed was a spectacular British featherweight."},{id:142,cat:"Boxers",lv:"rookie",q:"Which British fan-favorite was 'The Hitman' from Manchester?",opts:["Ricky Hatton","Ricky Burns","Carl Froch","David Haye"],fact:"Ricky Hatton was a beloved British junior welterweight."},{id:143,cat:"Boxers",lv:"rookie",q:"Which Welsh super middleweight retired undefeated?",opts:["Joe Calzaghe","Nathan Cleverly","Enzo Maccarinelli","Lee Selby"],fact:"Joe Calzaghe retired with an unbeaten record."},{id:144,cat:"Titles",lv:"rookie",q:"What is 'The Ring' magazine known for awarding?",opts:["Its own championship belt","Olympic medals","Amateur titles only","Referee licenses"],fact:"The Ring magazine awards a respected lineal-style championship belt."},{id:145,cat:"Titles",lv:"rookie",q:"What is a 'title eliminator'?",opts:["A bout to determine a mandatory challenger","A championship","An exhibition","A retirement bout"],fact:"An eliminator decides who becomes the next mandatory challenger."},{id:146,cat:"History",lv:"rookie",q:"What is a boxer's first professional bout called?",opts:["Their pro debut","Their farewell","Their title shot","Their exhibition"],fact:"The pro debut is a fighter's first paid professional fight."},{id:147,cat:"History",lv:"rookie",q:"What is an exhibition bout?",opts:["A non-competitive fight not counted on records","A title fight","An amateur championship","A mandatory defense"],fact:"Exhibitions don't count toward official records."},{id:148,cat:"History",lv:"rookie",q:"What is a 'tune-up' fight?",opts:["An easier bout to prepare for a bigger one","A championship","A rematch","An exhibition only"],fact:"A tune-up keeps a boxer sharp before a major fight."},{id:149,cat:"History",lv:"rookie",q:"What is a 'card' in boxing?",opts:["The lineup of bouts at an event","A judge's scoresheet only","A weight class","A type of glove"],fact:"A fight card is the slate of bouts on an event (the scorecard is separate)."},{id:150,cat:"History",lv:"rookie",q:"What is the 'main event'?",opts:["The featured top bout of the card","The first fight","The weigh-in","The undercard"],fact:"The main event is the headline fight."},{id:151,cat:"History",lv:"rookie",q:"What are the earlier fights before the main event called?",opts:["The undercard","The aftercard","The prelims of the weigh-in","The exhibition"],fact:"Undercard bouts precede the main event."},{id:152,cat:"Styles",lv:"rookie",q:"What is 'blocking' in defense?",opts:["Using the gloves or arms to stop punches","Holding the opponent","Running away","Ducking only"],fact:"Blocking absorbs punches with the guard."},{id:153,cat:"Styles",lv:"rookie",q:"What is 'parrying'?",opts:["Deflecting a punch with a hand","Throwing a hook","Clinching","Feinting"],fact:"Parrying knocks an incoming punch off target."},{id:154,cat:"Styles",lv:"rookie",q:"What is 'rolling with the punch'?",opts:["Moving with a blow to lessen its impact","Falling down","Blocking with the elbow","Clinching"],fact:"Rolling reduces a punch's force by moving with it."},{id:155,cat:"Styles",lv:"rookie",q:"What is 'bobbing and weaving'?",opts:["Head movement to avoid punches","A punching combination","A clinch","A scoring method"],fact:"Bobbing and weaving slips punches with rhythmic head movement."},{id:156,cat:"Styles",lv:"rookie",q:"What is a 'jab' primarily used for?",opts:["Setting up other punches and controlling distance","Only for knockouts","Blocking","Clinching"],fact:"The jab measures range and sets up combinations."},{id:157,cat:"Stats",lv:"rookie",q:"What does a high 'KO percentage' indicate?",opts:["A boxer wins many fights by knockout","A boxer loses often","A boxer is defensive","A boxer is an amateur"],fact:"A high KO ratio marks a heavy puncher."},{id:158,cat:"Stats",lv:"rookie",q:"What is 'ring generalship'?",opts:["Controlling the pace and location of the fight","A punch type","A foul","A weight class"],fact:"Ring generalship is a judging factor for who controls the action."},{id:159,cat:"Stats",lv:"rookie",q:"What is a boxer's 'chin' slang for?",opts:["Their ability to take a punch","Their reach","Their footwork","Their weight"],fact:"A good 'chin' means a boxer absorbs punishment well."},{id:160,cat:"Stats",lv:"rookie",q:"What is 'gas tank' slang for?",opts:["A boxer's stamina","Their power","Their reach","Their record"],fact:"'Gas tank' refers to a fighter's endurance."},{id:161,cat:"Rules",lv:"rookie",q:"What is the 'neutral corner' used for after a knockdown?",opts:["Where the standing boxer must wait during the count","The champion's rest spot","The judges' seats","The cutman's station"],fact:"After a knockdown, the other boxer goes to a neutral corner."},{id:162,cat:"Rules",lv:"rookie",q:"What is 'the count' interrupted by if the round ends (in non-title, when applicable)?",opts:["The bell, in some rulesets","The judges","The promoter","The crowd"],fact:"In some rules, the bell can interrupt a count except in championship rounds."},{id:163,cat:"Rules",lv:"rookie",q:"What is an accidental clash of heads that opens a cut ruled?",opts:["An accidental foul","An intentional foul","A knockdown","A legal blow"],fact:"An unintentional headbutt cut is treated as an accidental foul."},{id:164,cat:"Titles",lv:"rookie",q:"What makes a champion 'undisputed' again in simple terms?",opts:["Holding every major belt in the division","Winning one belt","Winning an amateur title","Retiring as champion"],fact:"Undisputed means one fighter holds all the major titles at once."},{id:165,cat:"Titles",lv:"rookie",q:"What is a 'vacant' title?",opts:["A belt with no current champion","A retired belt","An amateur belt","A unified belt"],fact:"A vacant title has no holder and is contested by two challengers."},{id:166,cat:"Boxers",lv:"rookie",q:"Which heavyweight was the first Black world heavyweight champion?",opts:["Jack Johnson","Joe Louis","Jack Dempsey","Sonny Liston"],fact:"Jack Johnson became the first Black heavyweight champion in 1908."},{id:167,cat:"Boxers",lv:"rookie",q:"Which 1920s champion was 'The Manassa Mauler'?",opts:["Jack Dempsey","Gene Tunney","Jack Sharkey","Max Baer"],fact:"Jack Dempsey, the Manassa Mauler, was a 1920s heavyweight icon."},{id:168,cat:"Boxers",lv:"rookie",q:"Which lightweight legend fought Durán and was 'The Explosive Thin Man' (Argüello)?",opts:["Alexis Argüello","Aaron Pryor","Ray Mancini","Wilfredo Gómez"],fact:"Alexis Argüello was a beloved three-division champion."},{id:169,cat:"Boxers",lv:"rookie",q:"Which Puerto Rican featherweight/junior featherweight great was 'Bazooka' Gómez?",opts:["Wilfredo Gómez","Wilfred Benítez","Héctor Camacho","Félix Trinidad"],fact:"Wilfredo Gómez was a knockout-heavy Puerto Rican champion."},{id:170,cat:"Boxers",lv:"rookie",q:"Which Puerto Rican star was 'Tito' Trinidad?",opts:["Félix Trinidad","Miguel Cotto","Héctor Camacho","John Ruiz"],fact:"Félix 'Tito' Trinidad was a Puerto Rican multi-division champion."},{id:171,cat:"Venues",lv:"rookie",q:"Which New York arena is famously 'The Mecca of Boxing'?",opts:["Madison Square Garden","Yankee Stadium","Barclays Center","The Forum"],fact:"Madison Square Garden is a historic home of championship boxing."},{id:172,cat:"Venues",lv:"rookie",q:"Which Las Vegas venue hosted many megafights next to a famous fountain?",opts:["Caesars Palace","The Bellagio pool","The Sphere only","The Strat"],fact:"Caesars Palace hosted many 1980s–90s megafights."},{id:173,cat:"Venues",lv:"rookie",q:"Which desert city became boxing's biggest modern fight capital?",opts:["Las Vegas","Miami","Chicago","Seattle"],fact:"Las Vegas is the modern hub of major boxing events."},{id:174,cat:"Promoters",lv:"rookie",q:"Which flamboyant promoter is known for wild hair and 'Only in America'?",opts:["Don King","Bob Arum","Frank Warren","Eddie Hearn"],fact:"Don King was one of boxing's most famous promoters."},{id:175,cat:"Promoters",lv:"rookie",q:"Which promoter founded Top Rank?",opts:["Bob Arum","Don King","Kathy Duva","Frank Warren"],fact:"Bob Arum founded the Top Rank promotional company."},{id:176,cat:"Trainers",lv:"rookie",q:"Who was Muhammad Ali's longtime trainer?",opts:["Angelo Dundee","Cus D'Amato","Emanuel Steward","Freddie Roach"],fact:"Angelo Dundee trained Ali throughout his career."},{id:177,cat:"Trainers",lv:"rookie",q:"Who was the mentor who molded a young Mike Tyson?",opts:["Cus D'Amato","Angelo Dundee","Freddie Roach","Naazim Richardson"],fact:"Cus D'Amato guided Tyson to the heavyweight title."},{id:178,cat:"Trainers",lv:"rookie",q:"Who founded and trained fighters at Detroit's Kronk gym?",opts:["Emanuel Steward","Angelo Dundee","Eddie Futch","Cus D'Amato"],fact:"Emanuel Steward built the famous Kronk gym."},{id:179,cat:"Trainers",lv:"rookie",q:"Who trained Manny Pacquiao for his rise to superstardom?",opts:["Freddie Roach","Angelo Dundee","Emanuel Steward","Nacho Beristáin"],fact:"Freddie Roach guided Pacquiao's career."},{id:180,cat:"Rules",lv:"rookie",q:"What is 'the ten-count' the origin of the phrase for?",opts:["Being counted out (a knockout)","Winning on points","A title defense","A weigh-in"],fact:"Being counted out to ten is a knockout loss."},{id:181,cat:"Rules",lv:"rookie",q:"Which corner does a boxer return to between rounds?",opts:["Their own corner","The neutral corner","The opponent's corner","Any corner"],fact:"Boxers rest in their assigned corner between rounds."},{id:182,cat:"Rules",lv:"rookie",q:"How is a winner declared if a fight goes the distance?",opts:["By the judges' scorecards","By knockout only","By the referee alone","By crowd vote"],fact:"If no stoppage occurs, judges' scorecards decide the winner."},{id:183,cat:"Rules",lv:"rookie",q:"What is 'going the distance'?",opts:["Completing all scheduled rounds","Winning by KO","Quitting early","Missing weight"],fact:"Going the distance means the bout reaches its final bell."},{id:184,cat:"Stats",lv:"rookie",q:"What is a boxer's 'record' written like '30-2-1' showing?",opts:["Wins, losses, draws","Rounds, knockdowns, fouls","Height, reach, weight","Titles, defenses, losses"],fact:"A record lists wins, losses, and draws in order."},{id:185,cat:"Stats",lv:"rookie",q:"What does the KO number in a record (e.g., '30-2-1, 25 KOs') show?",opts:["How many wins came by knockout","Total knockdowns","Losses by KO","Rounds fought"],fact:"The KO figure counts wins that ended by knockout."},{id:186,cat:"Divisions",lv:"rookie",q:"Which division is often the most popular and lucrative?",opts:["Heavyweight","Flyweight","Strawweight","Bantamweight"],fact:"Heavyweight has traditionally drawn the biggest audiences."},{id:187,cat:"Divisions",lv:"rookie",q:"What is 'strawweight' (minimumweight) known as?",opts:["The lightest professional division","The heaviest","A tag division","An amateur-only class"],fact:"Strawweight is boxing's lightest professional class."},{id:188,cat:"Boxers",lv:"rookie",q:"Which showman heavyweight of the 2000s was David 'The Hayemaker'?",opts:["David Haye","Dereck Chisora","Tyson Fury","Anthony Joshua"],fact:"David Haye unified cruiserweight titles before moving to heavyweight."},{id:189,cat:"Boxers",lv:"rookie",q:"Which British Olympic gold medalist became a heavyweight champion (Joshua)?",opts:["Anthony Joshua","Dillian Whyte","Daniel Dubois","Joe Joyce"],fact:"Anthony Joshua won Olympic gold before world titles."},{id:190,cat:"Boxers",lv:"rookie",q:"Which tall British heavyweight is 'The Gypsy King'?",opts:["Tyson Fury","Tyson Frazier","Derek Chisora","Dave Allen"],fact:"Tyson Fury is nicknamed 'the Gypsy King.'"},{id:191,cat:"Boxers",lv:"rookie",q:"Which American star was 'Pretty Boy' before 'Money' (Mayweather)?",opts:["Floyd Mayweather","Zab Judah","Shane Mosley","Andre Berto"],fact:"Mayweather boxed as 'Pretty Boy' early, then 'Money.'"},{id:192,cat:"History",lv:"rookie",q:"What is a rematch?",opts:["A second fight between the same two boxers","A tag-team bout","An amateur bout","An exhibition"],fact:"A rematch pits the same two fighters again, often after a close first bout."},{id:193,cat:"History",lv:"rookie",q:"What is a trilogy in boxing?",opts:["Three fights between the same two boxers","Three titles","Three rounds","Three judges"],fact:"A trilogy is a series of three bouts between two rivals."},{id:194,cat:"History",lv:"rookie",q:"What is a boxer 'coming out of retirement' called?",opts:["A comeback","A debut","A defense","A tune-up"],fact:"Returning after retiring is a comeback."},{id:195,cat:"Titles",lv:"rookie",q:"What is a boxer stripped of a title for (commonly)?",opts:["Failing to make a mandatory defense or missing weight","Winning too much","Retiring as champion","Signing autographs"],fact:"Champions can be stripped for not meeting sanctioning obligations or missing weight."},{id:196,cat:"Stats",lv:"rookie",q:"What is 'CompuBox' known for tracking?",opts:["Punch statistics thrown and landed","Weigh-in numbers","Judges' names","Ticket sales"],fact:"CompuBox counts punches thrown and landed during broadcasts."},{id:197,cat:"Rules",lv:"rookie",q:"What is the standard glove-touch before the first round a gesture of?",opts:["Sportsmanship","A foul","A scoring blow","A weigh-in"],fact:"Touching gloves is a customary sign of respect."},{id:198,cat:"Rules",lv:"rookie",q:"What is 'toeing the line' historically related to?",opts:["Meeting in the center to start a round (old bare-knuckle rules)","A modern foul","A scoring rule","A weight limit"],fact:"Old rules had fighters meet at a scratch line to begin."},{id:199,cat:"Styles",lv:"rookie",q:"What is a 'peekaboo' style associated with Tyson and D'Amato?",opts:["High guard with head movement and bursts","A long-range jab style","A clinch-heavy style","A running style"],fact:"The peekaboo uses a high guard and explosive head movement."},{id:200,cat:"Styles",lv:"rookie",q:"What is a 'switch-hitter' in boxing?",opts:["A boxer who changes between orthodox and southpaw","A boxer who only jabs","A boxer who clinches","A referee"],fact:"A switch-hitter can fight from either stance."},{id:201,cat:"Moments",lv:"allstar",q:"Who won the 1971 'Fight of the Century' between Ali and Frazier?",opts:["Joe Frazier","Muhammad Ali","It was a draw","No contest"],fact:"Frazier won a unanimous decision, handing Ali his first pro loss."},{id:202,cat:"Moments",lv:"allstar",q:"How did Ali beat Foreman in the 1974 'Rumble in the Jungle'?",opts:["An eighth-round knockout","A decision","A DQ","A first-round KO"],fact:"Ali used the rope-a-dope and stopped Foreman in the eighth."},{id:203,cat:"Moments",lv:"allstar",q:"Who won the 1975 'Thrilla in Manila'?",opts:["Muhammad Ali","Joe Frazier","It was a draw","Ken Norton"],fact:"Ali won when Frazier's corner stopped it before the 15th round."},{id:204,cat:"Moments",lv:"allstar",q:"Which trainer stopped the Thrilla in Manila to protect Joe Frazier?",opts:["Eddie Futch","Angelo Dundee","Yank Durham","Cus D'Amato"],fact:"Eddie Futch would not let a badly hurt Frazier come out for the last round."},{id:205,cat:"Moments",lv:"allstar",q:"Who scored the 1990 upset knockout of Mike Tys ents",lv:"allstar",q:"How did the fourth Pacquiao–Márquez fight end in 2012?",opts:["Márquez knocked Pacquiao out","Pacquiao won on points","A draw","A DQ"],fact:"Márquez landed a stunning knockout of Pacquiao in the sixth round."},{id:214,cat:"Moments",lv:"allstar",q:"Which 2005 lightweight classic saw Corrales rise from two knockdowns to stop Castillo?",opts:["Corrales–Castillo I","Gatti–Ward III","Barrera–Morales I","Vázquez–Márquez I"],fact:"Diego Corrales came off the canvas twice to stop José Luis Castillo."},{id:215,cat:"Moments",lv:"allstar",q:"Which rivalry produced the celebrated Gatti–Ward trilogy?",opts:["Arturo Gatti and Micky Ward","Barrera and Morales","Vázquez and Márquez","Corrales and Castillo"],fact:"Gatti and Ward fought three brutal, beloved fights in 2002–2003."},{id:216,cat:"Moments",lv:"allstar",q:"Who beat Ali in 1978 in only his eighth pro fight?",opts:["Leon Spinks","Ken Norton","Larry Holmes","Trevor Berbick"],fact:"Leon Spinks upset Ali to win the title, then lost the rematch."},{id:217,cat:"Moments",lv:"allstar",q:"Which 1927 rematch is remembered for the 'Long Count'?",opts:["Dempsey–Tunney II","Louis–Schmeling II","Ali–Liston II","Louis–Conn I"],fact:"Tunney beat Dempsey again after a disputed long count in the seventh."},{id:218,cat:"Moments",lv:"allstar",q:"Who knocked out Michael Spinks in 91 seconds in 1988?",opts:["Mike Tyson","Larry Holmes","Gerry Cooney","Trevor Berbick"],fact:"Tyson blitzed Spinks in the first round to cement his dominance."},{id:219,cat:"Records",lv:"allstar",q:"Which heavyweight made a record 25 title defenses?",opts:["Joe Louis","Muhammad Ali","Larry Holmes","Wladimir Klitschko"],fact:"Joe Louis defended the heavyweight title a record 25 times."},{id:220,cat:"Records",lv:"allstar",q:"Which heavyweight champion retired undefeated at 49-0?",opts:["Rocky Marciano","Joe Louis","Gene Tunney","Lennox Lewis"],fact:"Rocky Marciano is the only heavyweight to retire unbeaten at 49-0."},{id:221,cat:"Boxers",lv:"allstar",q:"Which fighter held the featherweight, lightweight, and welterweight titles at once in 1938?",opts:["Henry Armstrong","Barney Ross","Tony Canzoneri","Willie Pep"],fact:"Henry Armstrong simultaneously held three world titles."},{id:222,cat:"Boxers",lv:"allstar",q:"Which welterweight and middleweight great is often ranked the best pound-for-pound ever?",opts:["Sugar Ray Robinson","Willie Pep","Henry Armstrong","Benny Leonard"],fact:"Sugar Ray Robinson is frequently called the greatest pound-for-pound fighter."},{id:223,cat:"Boxers",lv:"allstar",q:"Which defensive featherweight wizard won around 229 pro fights?",opts:["Willie Pep","Sandy Saddler","Sugar Ray Robinson","Kid Chocolate"],fact:"Willie Pep was renowned for elusive defense and a huge win total."},{id:224,cat:"Boxers",lv:"allstar",q:"Which Argentine middleweight had a long, dominant reign and beat Nino Benvenuti?",opts:["Carlos Monzón","Víctor Galíndez","Juan Roldán","Sergio Martínez"],fact:"Carlos Monzón dominated the middleweight division for years."},{id:225,cat:"Boxers",lv:"allstar",q:"Who became the first light heavyweight champion to win the heavyweight title?",opts:["Michael Spinks","Bob Foster","Billy Conn","Archie Moore"],fact:"Michael Spinks moved up to beat Larry Holmes for the heavyweight crown."},{id:226,cat:"Boxers",lv:"allstar",q:"Which champion handed Larry Holmes his first loss to end a 48-0 start?",opts:["Michael Spinks","Mike Tyson","Gerry Cooney","Tim Witherspoon"],fact:"Michael Spinks upset Holmes in 1985, ending his unbeaten run."},{id:227,cat:"Boxers",lv:"allstar",q:"Which Puerto Rican teenager became a world champion at 17 in 1976?",opts:["Wilfred Benítez","Wilfredo Gómez","Héctor Camacho","Félix Trinidad"],fact:"Wilfred Benítez became the youngest world champion at age 17."},{id:228,cat:"Boxers",lv:"allstar",q:"Which featherweight beat Wilfredo Gómez and Danny López before dying young?",opts:["Salvador Sánchez","Rubén Olivares","Bobby Chacón","Alexis Argüello"],fact:"Salvador Sánchez beat both before his death at 23."},{id:229,cat:"Boxers",lv:"allstar",q:"Which fighter beat Alexis Argüello twice in celebrated 1982–83 bouts?",opts:["Aaron Pryor","Ray Mancini","Cornelius Boza-Edwards","Bobby Chacón"],fact:"Aaron Pryor won two thrilling fights over Argüello."},{id:230,cat:"Boxers",lv:"allstar",q:"Which middleweight set a division record with 20 title defenses?",opts:["Bernard Hopkins","Carlos Monzón","Marvin Hagler","Gennady Golovkin"],fact:"Bernard Hopkins made a record 20 middleweight title defenses."},{id:231,cat:"Boxers",lv:"allstar",q:"Which fighter beat both Trinidad and De La Hoya in the early 2000s?",opts:["Bernard Hopkins","Shane Mosley","Winky Wright","Ronald Wright"],fact:"Hopkins beat Trinidad in 2001 and De La Hoya in 2004."},{id:232,cat:"Boxers",lv:"allstar",q:"Which body shot ended the 2004 Hopkins–De La Hoya fight?",opts:["A left hook to the liver","A right cross","An uppercut","A jab"],fact:"Hopkins dropped De La Hoya with a liver shot for the KO."},{id:233,cat:"Boxers",lv:"allstar",q:"Which slick defensive lightweight/welterweight was nicknamed 'Sweet Pea'?",opts:["Pernell Whitaker","Shane Mosley","Zab Judah","Kostya Tszyu"],fact:"Pernell 'Sweet Pea' Whitaker was a defensive master."},{id:234,cat:"Boxers",lv:"allstar",q:"Which dazzling talent held titles from middleweight up to heavyweight (Jones)?",opts:["Roy Jones Jr.","James Toney","Bernard Hopkins","Antonio Tarver"],fact:"Roy Jones Jr. even won a heavyweight title after ruling lighter classes."},{id:235,cat:"Boxers",lv:"allstar",q:"Which Australian-based junior welterweight champion did Ricky Hatton beat in 2005?",opts:["Kostya Tszyu","Vince Phillips","Zab Judah","Junior Witter"],fact:"Hatton stopped Kostya Tszyu to win a world title in 2005."},{id:236,cat:"Boxers",lv:"allstar",q:"Which Puerto Rican multi-division champion did both Pacquiao and Mayweather defeat?",opts:["Miguel Cotto","Félix Trinidad","Juan Manuel López","Iván Calderón"],fact:"Miguel Cotto lost to Pacquiao in 2009 and Mayweather in 2012."},{id:237,cat:"Boxers",lv:"allstar",q:"Which fighter stopped Ricky Hatton in the 10th round in 2007?",opts:["Floyd Mayweather","Manny Pacquiao","Kostya Tszyu","Juan Lazcano"],fact:"Mayweather stopped Hatton in the 10th round in 2007."},{id:238,cat:"Boxers",lv:"allstar",q:"Which middleweight champion did Kelly Pavlik dethrone in 2007?",opts:["Jermain Taylor","Bernard Hopkins","Arthur Abraham","Winky Wright"],fact:"Pavlik knocked out Jermain Taylor to win the middleweight title."},{id:239,cat:"History",lv:"allstar",q:"Which future heavyweight great won 1960 Olympic gold as Cassius Clay?",opts:["Muhammad Ali","Joe Frazier","George Foreman","Floyd Patterson"],fact:"Cassius Clay won light heavyweight gold in Rome in 1960."},{id:240,cat:"History",lv:"allstar",q:"Which heavyweight won Olympic gold in 1968 and waved a small U.S. flag?",opts:["George Foreman","Joe Frazier","Ken Norton","Leon Spinks"],fact:"George Foreman won gold at the 1968 Mexico City Games."},{id:241,cat:"History",lv:"allstar",q:"Which fighter won Olympic gold in 1964 before turning pro?",opts:["Joe Frazier","George Foreman","Muhammad Ali","Ken Norton"],fact:"Joe Frazier won heavyweight gold at the 1964 Tokyo Games."},{id:242,cat:"History",lv:"allstar",q:"Which 1976 Olympic gold medalist became a 1980s superstar?",opts:["Sugar Ray Leonard","Thomas Hearns","Marvin Hagler","Aaron Pryor"],fact:"Sugar Ray Leonard won gold in Montreal in 1976."},{id:243,cat:"History",lv:"allstar",q:"Which 1992 Olympic gold medalist was nicknamed the 'Golden Boy'?",opts:["Oscar De La Hoya","Fernando Vargas","Shane Mosley","Floyd Mayweather"],fact:"Oscar De La Hoya won gold at the 1992 Barcelona Games."},{id:244,cat:"History",lv:"allstar",q:"Which future undisputed heavyweight champ won 1988 Olympic gold for Canada?",opts:["Lennox Lewis","Riddick Bowe","Ray Mercer","Michael Moorer"],fact:"Lennox Lewis won super heavyweight gold for Canada in 1988."},{id:245,cat:"History",lv:"allstar",q:"Which future champ won Olympic gold in 1952 and later held the heavyweight title (Patterson)?",opts:["Floyd Patterson","Archie Moore","Ezzard Charles","Jersey Joe Walcott"],fact:"Floyd Patterson won middleweight gold in Helsinki in 1952."},{id:246,cat:"History",lv:"allstar",q:"Which British heavyweight won Olympic gold in 2012 before pro titles?",opts:["Anthony Joshua","Tyson Fury","Dillian Whyte","Joe Joyce"],fact:"Anthony Joshua won super heavyweight gold at London 2012."},{id:247,cat:"Boxers",lv:"allstar",q:"Which champion was the first Black world heavyweight champion?",opts:["Jack Johnson","Joe Louis","Jack Dempsey","Sonny Liston"],fact:"Jack Johnson won the heavyweight title in 1908."},{id:248,cat:"Boxers",lv:"allstar",q:"Which 1920s 'Manassa Mauler' drew huge crowds and gates?",opts:["Jack Dempsey","Gene Tunney","Jack Sharkey","Primo Carnera"],fact:"Jack Dempsey was a 1920s heavyweight superstar."},{id:249,cat:"Boxers",lv:"allstar",q:"Which fighter beat Jack Dempsey twice to take the heavyweight title?",opts:["Gene Tunney","Jack Sharkey","Max Schmeling","Jess Willard"],fact:"Gene Tunney beat Dempsey in 1926 and 1927."},{id:250,cat:"Boxers",lv:"allstar",q:"Which German heavyweight beat Joe Louis in 1936 before Louis's 1938 revenge?",opts:["Max Schmeling","Max Baer","Primo Carnera","Jess Willard"],fact:"Max Schmeling beat Louis in 1936; Louis destroyed him in a 1938 rematch."},{id:251,cat:"Boxers",lv:"allstar",q:"Who famously knocked out Max Schmeling in the first round in 1938?",opts:["Joe Louis","Jack Dempsey","Billy Conn","Jersey Joe Walcott"],fact:"Joe Louis stopped Schmeling in 124 seconds in their 1938 rematch."},{id:252,cat:"Boxers",lv:"allstar",q:"Which light heavyweight nearly beat Joe Louis in 1941 before being stopped (Conn)?",opts:["Billy Conn","Bob Pastor","Buddy Baer","Tami Mauriello"],fact:"Billy Conn was ahead before Louis stopped him in the 13th."},{id:253,cat:"Boxers",lv:"allstar",q:"Which two champions did Rocky Marciano beat to define his run — including which aging legend in 1951?",opts:["Joe Louis","Jack Dempsey","Gene Tunney","Max Baer"],fact:"Marciano knocked out an aging Joe Louis in 1951."},{id:254,cat:"Boxers",lv:"allstar",q:"Which champion did Muhammad Ali upset in 1964 to first win the title?",opts:["Sonny Liston","Floyd Patterson","Ernie Terrell","Zora Folley"],fact:"Ali (then Clay) beat the feared Sonny Liston in 1964."},{id:255,cat:"Boxers",lv:"allstar",q:"Which fighter broke Muhammad Ali's jaw and beat him in 1973?",opts:["Ken Norton","Joe Frazier","George Foreman","Jerry Quarry"],fact:"Ken Norton broke Ali's jaw and won a decision in 1973."},{id:256,cat:"Boxers",lv:"allstar",q:"Which champion did George Foreman destroy in two rounds to win the title in 1973?",opts:["Joe Frazier","Muhammad Ali","Ken Norton","Jimmy Ellis"],fact:"Foreman flattened Frazier in two rounds in 1973."},{id:257,cat:"Boxers",lv:"allstar",q:"Which heavyweight had a long reign in the late 1970s–80s and beat Ken Norton for the title?",opts:["Larry Holmes","Leon Spinks","Michael Dokes","Gerry Cooney"],fact:"Larry Holmes beat Norton in 1978 and reigned for years."},{id:258,cat:"Boxers",lv:"allstar",q:"Which cruiserweight-turned-heavyweight beat Tyson twice in the 1990s?",opts:["Evander Holyfield","Riddick Bowe","Michael Moorer","Lennox Lewis"],fact:"Evander Holyfield beat Tyson in 1996 and 1997."},{id:259,cat:"Boxers",lv:"allstar",q:"Which British-Canadian unified the heavyweight titles and beat Tyson in 2002?",opts:["Lennox Lewis","Frank Bruno","Herbie Hide","Henry Akinwande"],fact:"Lennox Lewis stopped Tyson in 2002."},{id:260,cat:"Boxers",lv:"allstar",q:"Which Ukrainian held a heavyweight title for roughly a decade in the 2000s–2010s?",opts:["Wladimir Klitschko","Vitali Klitschko","Sultan Ibragimov","Ruslan Chagaev"],fact:"Wladimir Klitschko had one of the longest heavyweight reigns."},{id:261,cat:"Trainers",lv:"allstar",q:"Which trainer worked corners for both Ali and Sugar Ray Leonard?",opts:["Angelo Dundee","Eddie Futch","Cus D'Amato","Emanuel Steward"],fact:"Angelo Dundee trained Ali and later Leonard."},{id:262,cat:"Trainers",lv:"allstar",q:"Which trainer mentored Mike Tyson as a teenager?",opts:["Cus D'Amato","Angelo Dundee","Freddie Roach","Kevin Rooney"],fact:"Cus D'Amato developed a young Tyson."},{id:263,cat:"Trainers",lv:"allstar",q:"Which trainer built Detroit's Kronk gym and guided Hearns and Lewis?",opts:["Emanuel Steward","Eddie Futch","Angelo Dundee","Naazim Richardson"],fact:"Emanuel Steward trained Thomas Hearns and Lennox Lewis."},{id:264,cat:"Trainers",lv:"allstar",q:"Which trainer guided Manny Pacquiao's rise at the Wild Card gym?",opts:["Freddie Roach","Nacho Beristáin","Robert García","Buddy McGirt"],fact:"Freddie Roach trained Pacquiao for most of his prime."},{id:265,cat:"Trainers",lv:"allstar",q:"Which respected trainer stopped the Thrilla in Manila and later trained many champions?",opts:["Eddie Futch","Angelo Dundee","Ray Arcel","Gil Clancy"],fact:"Eddie Futch was a legendary trainer of numerous champions."},{id:266,cat:"Trainers",lv:"allstar",q:"Which Mexican trainer is famed for guiding Juan Manuel Márquez?",opts:["Nacho Beristáin","Freddie Roach","Robert García","Ignacio Beristáin"],fact:"Nacho Beristáin is one of Mexico's most respected trainers."},{id:267,cat:"Venues",lv:"allstar",q:"Which arena is nicknamed 'The Mecca of Boxing'?",opts:["Madison Square Garden","Caesars Palace","The Forum","Wembley Arena"],fact:"Madison Square Garden is a storied home of championship boxing."},{id:268,cat:"Venues",lv:"allstar",q:"Which Las Vegas resort hosted many 1980s megafights outdoors?",opts:["Caesars Palace","The Mirage","The Sphere","The Sands"],fact:"Caesars Palace hosted numerous classic outdoor fights."},{id:269,cat:"Venues",lv:"allstar",q:"In which city was the 'Thrilla in Manila' staged?",opts:["Quezon City, Philippines","Kinshasa, Zaire","Tokyo, Japan","Kingston, Jamaica"],fact:"The Thrilla in Manila took place in the Philippines in 1975."},{id:270,cat:"Venue te","Joseph Parker","Alexander Povetkin"],fact:"Dereck Chisora is a durable modern heavyweight gatekeeper."},{id:559,cat:"Boxers",lv:"pro",q:"Which New Zealander held a heavyweight belt and fought Joshua and Fury era names (Parker)?",opts:["Joseph Parker","Lucas Browne","David Tua","Junior Fa"],fact:"Joseph Parker held a heavyweight title and faced top contenders."},{id:560,cat:"History",lv:"pro",q:"Which weight-management practice risks a fighter's health before a bout?",opts:["Extreme weight cutting","Overeating","Skipping training","Sparring lightly"],fact:"Severe weight cuts can endanger fighters at the scale and in the ring."},{id:561,cat:"Rules",lv:"pro",q:"What is a 'same-day' vs 'day-before' weigh-in difference about?",opts:["When fighters must make weight relative to the fight","The number of judges","The glove size","The ring size"],fact:"Weigh-in timing affects rehydration and safety."},{id:562,cat:"Rules",lv:"pro",q:"What is a 'rehydration clause' in some contracts?",opts:["A limit on how much weight a boxer can regain after the weigh-in","A ticket rule","A judging rule","A glove rule"],fact:"Rehydration clauses cap post-weigh-in weight gain."},{id:563,cat:"Titles",lv:"pro",q:"What is a 'franchise' or 'super' champion designation meant to allow?",opts:["A champion more freedom from mandatory defenses","Amateur status","A retirement belt","A lower weight"],fact:"Such designations can ease a champion's mandatory obligations."},{id:564,cat:"Titles",lv:"pro",q:"What is a 'regular' vs 'super' champion split within one body (e.g., WBA) known to cause?",opts:["Multiple 'champions' in one division under one body","A single champion","An amateur bracket","A unified title"],fact:"Some bodies have crowned multiple champions in one division, causing confusion."},{id:565,cat:"Boxers",lv:"pro",q:"Which slick lightweight was Ismael Laguna, a Panamanian champion?",opts:["Ismael Laguna","Ernesto Marcel","Roberto Durán","Eusebio Pedroza"],fact:"Ismael Laguna was a Panamanian lightweight champion."},{id:566,cat:"Boxers",lv:"pro",q:"Which Panamanian featherweight had a long 1970s–80s reign (Pedroza)?",opts:["Eusebio Pedroza","Ernesto Marcel","Ismael Laguna","Hilario Zapata"],fact:"Eusebio Pedroza defended the featherweight title many times."},{id:567,cat:"Boxers",lv:"pro",q:"Which Ghanaian featherweight/junior lightweight fought Gatti-era wars and was 'The Professor' (Azumah Nelson)?",opts:["Azumah Nelson","Ike Quartey","David Kotey","Joshua Clottey"],fact:"Azumah Nelson is considered Africa's greatest boxer by many."},{id:568,cat:"Divisions",lv:"pro",q:"Which is the lightest men's Olympic-tradition weight tier informally, near light flyweight?",opts:["Light flyweight (108 lb pro)","Cruiserweight","Middleweight","Welterweight"],fact:"Light flyweight (junior flyweight) is around 108 pounds."},{id:569,cat:"Stats",lv:"pro",q:"What is a 'granite chin' shorthand for?",opts:["Exceptional ability to take punches","A weak jaw","Poor stamina","Slow hands"],fact:"A 'granite chin' means a fighter rarely gets hurt."},{id:570,cat:"Stats",lv:"pro",q:"What is a 'glass jaw'?",opts:["A vulnerability to being knocked down or out","Great durability","High work rate","Long reach"],fact:"A 'glass jaw' means a fighter is easily hurt."},{id:571,cat:"Styles",lv:"pro",q:"What is a 'jab-and-grab' style criticized as?",opts:["Jabbing then clinching to stifle action","An aggressive KO style","A pure slugging style","A body-punching style"],fact:"'Jab-and-grab' is a spoiling, clinch-heavy approach."},{id:572,cat:"Styles",lv:"pro",q:"What is 'ring rust'?",opts:["Diminished sharpness after a long layoff","A cut","A weight issue","A glove defect"],fact:"Ring rust is the rustiness from time away from competition."},{id:573,cat:"History",lv:"pro",q:"Which entity commonly issues and enforces licenses and rules per U.S. state?",opts:["State athletic commissions","The IOC","The NCAA","FIFA"],fact:"State athletic commissions regulate professional boxing in the U.S."},{id: reatest ever."},{id:589,cat:"Boxers",lv:"pro",q:"Which fighter did Meldrick Taylor nearly beat before a last-seconds stoppage (Chávez)?",opts:["Julio César Chávez","Pernell Whitaker","Buddy McGirt","Terry Norris"],fact:"Taylor was seconds from beating Chávez in their 1990 classic."},{id:590,cat:"Boxers",lv:"pro",q:"Which junior middleweight was 'Terrible' Terry Norris?",opts:["Terry Norris","Simon Brown","Gianfranco Rosi","Julian Jackson"],fact:"Terry Norris was a fast, hard-hitting junior middleweight champion."},{id:591,cat:"Boxers",lv:"pro",q:"Which one-punch KO artist at junior middleweight/middleweight was Julian Jackson?",opts:["Julian Jackson","Terry Norris","Gerald McClellan","Nigel Benn"],fact:"Julian Jackson possessed frightening one-punch power."},{id:592,cat:"Boxers",lv:"pro",q:"Which tragic 1995 fight left Gerald McClellan gravely injured against Nigel Benn?",opts:["Benn vs. McClellan","Benn vs. Eubank","Eubank vs. Watson","Collins vs. Benn"],fact:"The Benn–McClellan war ended in severe injury to McClellan."},{id:593,cat:"Boxers",lv:"pro",q:"Which 1991 fight left Michael Watson seriously injured against Chris Eubank?",opts:["Eubank vs. Watson II","Benn vs. Eubank I","Collins vs. Eubank","Benn vs. McClellan"],fact:"The Eubank–Watson rematch led to Watson's serious injury and safety reforms in Britain."},{id:594,cat:"History",lv:"pro",q:"Which safety improvements followed severe ring injuries in 1990s Britain?",opts:["Better ringside medical protocols","Longer rounds","Removing gloves","Bare-knuckle rules"],fact:"High-profile injuries spurred improved ringside medical readiness."},{id:595,cat:"Boxers",lv:"pro",q:"Which unbeaten Welsh super-middleweight beat Jeff Lacy in a masterclass (Calzaghe)?",opts:["Joe Calzaghe","Carl Froch","Richie Woodhall","Robin Reid"],fact:"Joe Calzaghe dominated the previously feared Jeff Lacy in 2006."},{id:596,cat:"Boxers",lv:"pro",q:"Which American did Calzaghe outpoint in the U.S. in 2008 (Hopkins)?",opts:["Bernard Hopkins" ell","George Chuvalo"],fact:"Ali beat the fearsome Sonny Liston in 1964."},{id:605,cat:"Legends",lv:"legends",q:"Why was Ali stripped of his title and license in the late 1960s?",opts:["His refusal of military induction","A failed drug test","Missing weight","A contract dispute"],fact:"Ali was stripped after refusing induction into the military."},{id:606,cat:"Legends",lv:"legends",q:"How many times did Ali and Joe Frazier fight?",opts:["Three","Two","Four","Once"],fact:"Ali and Frazier fought a legendary trilogy."},{id:607,cat:"Legends",lv:"legends",q:"Which Ali tactic helped him beat Foreman in Zaire?",opts:["The rope-a-dope","The peekaboo","The bolo","The shoulder roll"],fact:"Ali's rope-a-dope drained Foreman before an eighth-round KO."},{id:608,cat:"Legends",lv:"legends",q:"Which real name belonged to Sugar Ray Robinson?",opts:["Walker Smith Jr.","Cassius Clay","Arnold Cream","Rocco Marchegiano"],fact:"Sugar Ray Robinson was born Walker Smith Jr."},{id:609,cat:"Legends",lv:"legends",q:"In which two divisions did Sugar Ray Robinson win world titles?",opts:["Welterweight and middleweight","Lightweight and welterweight","Featherweight and lightweight","Middleweight and light heavyweight"],fact:"Robinson ruled welterweight, then won the middleweight title multiple times."},{id:610,cat:"Legends",lv:"legends",q:"Roughly how many professional fights did Sugar Ray Robinson have?",opts:["Around 200","About 50","About 500","About 20"],fact:"Robinson fought roughly 200 professional bouts."},{id:611,cat:"Legends",lv:"legends",q:"Which rival did Robinson fight six times, inspiring 'Raging Bull'?",opts:["Jake LaMotta","Carmen Basilio","Gene Fullmer","Randy Turpin"],fact:"Robinson met Jake LaMotta six times."},{id:612,cat:"Legends",lv:"legends",q:"Which heavyweight held the title for a record ~12 years (Joe Louis)?",opts:["Joe Louis","Muhammad Ali","Larry Holmes","Jack Dempsey"],fact:"Joe Louis reigned from 1937 to 1949, the longest heavyweight reign."},{id:613,cat:"Legends", orld titles in five weight classes."},{id:631,cat:"Legends",lv:"legends",q:"Whom did Mayweather beat in the record-shattering 2015 PPV megafight?",opts:["Manny Pacquiao","Oscar De La Hoya","Canelo Álvarez","Ricky Hatton"],fact:"Mayweather beat Pacquiao in the long-awaited 2015 bout."},{id:632,cat:"Legends",lv:"legends",q:"Which Filipino icon won titles across a famously wide range of divisions?",opts:["Manny Pacquiao","Nonito Donaire","Gerry Peñalosa","Luisito Espinosa"],fact:"Pacquiao won titles from the lower weights up to junior middleweight."},{id:633,cat:"Legends",lv:"legends",q:"Which office did Manny Pacquiao hold in the Philippines during his career?",opts:["Senator","Mayor only","President","Governor"],fact:"Pacquiao served as a Philippine senator."},{id:634,cat:"Legends",lv:"legends",q:"Which trainer guided Pacquiao's prime years?",opts:["Freddie Roach","Nacho Beristáin","Emanuel Steward","Angelo Dundee"],fact:"Freddie Roach trained Pacquiao at the Wild Card gym."},{id:635,cat:"Legends",lv:"legends",q:"Which heavyweight was 'Iron Mike'?",opts:["Mike Tyson","Mike Weaver","Michael Spinks","Michael Moorer"],fact:"Mike Tyson terrorized the heavyweight division in the late 1980s."},{id:636,cat:"Legends",lv:"legends",q:"Who was the mentor who molded a teenage Mike Tyson?",opts:["Cus D'Amato","Angelo Dundee","Emanuel Steward","Eddie Futch"],fact:"Cus D'Amato guided Tyson's development."},{id:637,cat:"Legends",lv:"legends",q:"Whom did Tyson beat in 1986 to become the youngest heavyweight titlist?",opts:["Trevor Berbick","Michael Spinks","Larry Holmes","Tony Tucker"],fact:"Tyson stopped Trevor Berbick to win his first title."},{id:638,cat:"Legends",lv:"legends",q:"Who stunned Tyson with a 10th-round knockout in Tokyo in 1990?",opts:["Buster Douglas","Evander Holyfield","Frank Bruno","Michael Moorer"],fact:"James 'Buster' Douglas pulled off one of sport's greatest upsets."},{id:639,cat:"Legends",lv:"legends",q:"Which two-time heavyweight champ became a grill entrepr ends",q:"Which fighter knocked out Michael Spinks in 91 seconds in 1988?",opts:["Mike Tyson","Larry Holmes","Trevor Berbick","Tony Tucker"],fact:"Tyson blitzed Spinks in the first round in 1988."},{id:714,cat:"Legends",lv:"legends",q:"Which heavyweight had the longest modern reign, holding a title for roughly a decade (Wladimir Klitschko)?",opts:["Wladimir Klitschko","Vitali Klitschko","Lennox Lewis","Riddick Bowe"],fact:"Wladimir Klitschko held a heavyweight title for about a decade."},{id:715,cat:"Legends",lv:"legends",q:"Which champion ended Wladimir Klitschko's reign in 2015?",opts:["Tyson Fury","Anthony Joshua","Alexander Povetkin","Kubrat Pulev"],fact:"Tyson Fury outpointed Klitschko in 2015."},{id:716,cat:"Legends",lv:"legends",q:"Which of the Klitschko brothers rarely lost and only via cuts (Vitali)?",opts:["Vitali Klitschko","Wladimir Klitschko","Both equally","Neither"],fact:"Vitali's pro losses came on cuts, never by decision."},{id:717,cat:"Legends",lv:"legends",q:"Which heavyweight great is often ranked #1 all-time alongside Ali and Louis (Marciano/Louis debate) — who went 49-0?",opts:["Rocky Marciano","Larry Holmes","Gene Tunney","Floyd Patterson"],fact:"Marciano's perfect record keeps him in every all-time debate."},{id:718,cat:"Legends",lv:"legends",q:"Which early middleweight champion was nicknamed 'The Michigan Assassin'?",opts:["Stanley Ketchel","Harry Greb","Mickey Walker","Tiger Flowers"],fact:"Stanley Ketchel was a ferocious early middleweight champion."},{id:719,cat:"Legends",lv:"legends",q:"Which champion is the namesake of boxing's 'sweet science' skill ideal, embodied by defensive masters like Pep and Whitaker?",opts:["No single person — it describes elite defensive skill","Muhammad Ali only","Mike Tyson only","George Foreman only"],fact:"'The sweet science' celebrates elite ring skill, not one fighter."},{id:720,cat:"Legends",lv:"legends",q:"Which fighter's six-fight rivalry with Robinson made him a household name (LaMotta)?",opts:["Jake L  'Big George' who lost to Ali but reigned in the 1970s and 1990s?",opts:["George Foreman","George Chuvalo","George Forbes","George Kimball"],fact:"George Foreman won the title in two different decades."},{id:745,cat:"Legends",lv:"legends",q:"Which pound-for-pound modern great retired 50-0 and never lost a round to some — best defensive career of his era (Mayweather)?",opts:["Floyd Mayweather","Andre Ward","Pernell Whitaker","Willie Pep"],fact:"Mayweather's defense anchored his unbeaten 50-0 career."},{id:746,cat:"Legends",lv:"legends",q:"Which champion beat both Barrera and Morales among his wins, a Mexican featherweight king (all faced Pacquiao too) — who KO'd Pacquiao in 2012?",opts:["Juan Manuel Márquez","Marco Antonio Barrera","Érik Morales","Rafael Márquez"],fact:"Juan Manuel Márquez knocked out Pacquiao in their fourth fight."},{id:747,cat:"Legends",lv:"legends",q:"Which unbeaten cruiserweight-to-heavyweight technician is Oleksandr Usyk's amateur-honed style compared to?",opts:["A slick, high-volume boxer-mover","A one-punch slugger","A pure clincher","A bare-knuckle brawler"],fact:"Usyk's style reflects an elite amateur boxer-mover."},{id:748,cat:"Legends",lv:"legends",q:"Which heavyweight was 'The Gypsy King,' who beat Klitschko and Wilder-era foes?",opts:["Tyson Fury","Anthony Joshua","Deontay Wilder","Dillian Whyte"],fact:"Tyson Fury is the self-styled 'Gypsy King.'"},{id:749,cat:"Legends",lv:"legends",q:"Which champion is remembered for the liver-shot KO of De La Hoya and a career into his late 40s (Hopkins)?",opts:["Bernard Hopkins","Roy Jones Jr.","James Toney","Antonio Tarver"],fact:"Bernard Hopkins combined longevity with a signature body-shot win."},{id:750,cat:"Legends",lv:"legends",q:"Which lightweight great of Mexican descent was Julio César Chávez's countryman idol status — who is Mexico's most beloved boxer?",opts:["Julio César Chávez","Salvador Sánchez","Rubén Olivares","Érik Morales"],fact:"Chávez is often called Mexico's most beloved fighter.
